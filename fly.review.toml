# Fly.io config for PR review apps (see .github/workflows/fly-review.yml).
# The review-apps action copies this file and renames the app to
# pr-<number>-spudly-eciperay, so `app` below is only a placeholder.
#
# Deliberate differences from fly.toml (production):
#   - The [deploy] release_command matches production and the persistent
#     preview (#596): review apps share the Supabase QA dataset with the
#     preview, and until #596 only the preview's master deploys migrated
#     that dataset — so a PR whose code selects a column its own migration
#     adds (e.g. #581 selecting meal_plan_entries.day, migration 028) ran
#     against an unmigrated schema and threw `column "day" does not
#     exist`. Review-app deploys now migrate the QA dataset before the
#     new code serves traffic, exactly like the other environments. This
#     is safe only because the dataset is QA-only: review apps must never
#     be pointed at production data, and repo migrations are additive and
#     idempotent (`add column if not exists`, tracked in _migrations).
#   - min_machines_running = 0: previews scale to zero when idle and are
#     destroyed when the PR closes; they should cost as little as possible.

app = 'eciperay'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

  [build.args]
    VITE_API_BASE_URL = '/api'

[deploy]
  release_command = 'npm run migrate --workspace=packages/server'

[env]
  NODE_ENV = 'production'
  HOST = '0.0.0.0'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '15s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
