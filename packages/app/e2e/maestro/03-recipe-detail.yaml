# Use case: the recipe detail screen renders a recipe's ingredients
# and instructions (#183 Phase 2).
#
# Navigation: the CI step delivers the recipe's deep link
# (com.eciperay://recipes/e2e-recipe-pasta — recipeHref in
# lib/deepLinks) to MainActivity with an explicit-component intent
# immediately before running this flow, and the app's linking config
# routes it to RecipeDetail. An explicit component is required because
# the manifest's only VIEW intent filter is host-scoped to the Supabase
# auth callback, so a plain VIEW intent does not resolve; and the DS
# href rows expose no clickable node to Maestro's hierarchy taps (the
# Home browse row reports clickable=false — verified against the
# 2026-11-03 CI run), so neither openLink nor a row tap can get here.
# This flow therefore asserts against the already-navigated app
# WITHOUT launchApp: launchApp restarts the app process, which resets
# the (unpersisted) navigation state back to Home and would undo the
# intent's routing before the assertions run (verified against the
# 2026-11-03 CI run — the detail visit was recorded in Home's Recently
# viewed, but the flow asserted against the relaunched Home screen).
#
# Scrolling: the page is a single scroll — Overview, Ingredients,
# Instructions, Cook History, Nutrition (RecipeDetailPage's section
# order). scrollUntilVisible overshoots the short Ingredients and
# Instructions bands: its fast swipes transit from the overview to the
# nutrition section at the bottom without either band ever appearing
# in a polled hierarchy (verified in two CI runs, 20s and 90s
# windows). This flow instead walks down with short, slow drags and
# asserts each section as it enters the viewport. Ingredient rows are
# single labels ("400 g Crushed tomatoes" — formatScaledIngredientLine
# in packages/client), so a name substring matches the row.
appId: com.eciperay
---
- assertVisible: "E2E Weeknight Pasta"
- swipe:
    start: 50%, 70%
    end: 50%, 45%
    duration: 600
- assertVisible: "Ingredients"
- assertVisible: "Crushed tomatoes"
- swipe:
    start: 50%, 70%
    end: 50%, 45%
    duration: 600
- assertVisible: "Simmer the sauce for 15 minutes."
