# Use cases: the Recipes screen renders its filter bar and recipe list,
# and opening a recipe renders its detail (#183 Phase 2).
#
# The filter-bar and list assertions are the #162 regression coverage:
# that bug shipped a build whose Recipes screen was one giant empty box
# — no search field, no filter controls, no recipe cards — in a build
# that compiled fine. If that failure mode returns, the assertions below
# fail: the search field, the Filters control, both filter add-labels
# (the same presence checks the #162-era Jest tests encode), and both
# fixture recipe cards must all be present in the real native render.
#
# Navigation uses the app's own deep links. In-app destinations are
# hrefs opened verbatim through the linking config (#248), and the DS
# link rows do not expose a clickable node to Maestro's hierarchy taps:
# in the 2026-11-03 CI run the Home browse row reported
# clickable=false, so a text tap landed on a visual container and never
# navigated. The deep links below are the same destinations the rows'
# hrefs carry (recipesHref / recipeHref in lib/deepLinks).
appId: com.eciperay
---
- launchApp:
    clearState: true
- openLink: com.eciperay://recipes
- assertVisible: "Search recipes…"
- assertVisible: "Filters"
- assertVisible: "Add Status filter"
- assertVisible: "Add Sort filter"
- assertVisible: "E2E Weeknight Pasta"
- assertVisible: "E2E Garden Salad"
- openLink: com.eciperay://recipes/e2e-recipe-pasta
- assertVisible: "E2E Weeknight Pasta"
- scrollUntilVisible:
    element:
      text: "Crushed tomatoes"
- assertVisible: "Crushed tomatoes"
- scrollUntilVisible:
    element:
      text: "Simmer the sauce for 15 minutes."
- assertVisible: "Simmer the sauce for 15 minutes."
