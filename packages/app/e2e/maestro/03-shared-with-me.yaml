# Use case: the Shared with me screen renders its content (#183
# Phase 2) — the fixture recipe another user shared, inside the same
# filter-bar list the Recipes screen uses.
#
# Navigation uses the app's own deep link (sharedWithMeHref in
# lib/deepLinks) for the reason documented in 02-recipes-and-detail:
# the DS href rows expose no clickable node to Maestro's hierarchy
# taps, and the deep link is the destination the row's href carries.
appId: com.eciperay
---
- launchApp:
    clearState: true
- openLink: com.eciperay://shared-with-me
- assertVisible: "E2E Shared Tomato Soup"
- assertVisible: "Search recipes…"
