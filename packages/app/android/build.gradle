buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP version must be pinned to the version React Native's Gradle plugin
        // expects: RNGP 0.88 uses AGP 9.2.1 (libs.versions.toml in
        // @react-native/gradle-plugin). AGP 9 ships built-in Kotlin, so the app
        // must NOT also apply the org.jetbrains.kotlin.android plugin.
        classpath("com.android.tools.build:gradle:9.2.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.posthog:posthog-android-gradle-plugin:1.2.0")
    }
}

apply plugin: "com.facebook.react.rootproject"
