buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP version must be pinned to the version React Native's Gradle plugin
        // expects: RNGP 0.88 uses AGP 9.2.1 (libs.versions.toml in
        // @react-native/gradle-plugin). AGP 9 ships built-in Kotlin, so the app
        // must NOT also apply the org.jetbrains.kotlin.android plugin.
        classpath("com.android.tools.build:gradle:9.2.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.posthog:posthog-android-gradle-plugin:1.2.0")
    }
}

apply plugin: "com.facebook.react.rootproject"

// AGP 9's built-in Kotlin compiles from a separate Kotlin source set that
// does not inherit directories added to a module's Java source set.
// react-native-localize adds its architecture-specific sources
// (src/newarch, containing RNLocalizeModule.kt) only via java.srcDirs,
// so under AGP 9 they are never compiled and RNLocalizePackage fails
// with an unresolved reference. Mirror the Java source directories into
// the Kotlin source set for that module. (patch-package cannot be used
// here: the package is installed nested under packages/app/node_modules,
// and patch-package only supports root-level packages.)
subprojects { subproject ->
    if (subproject.name == 'react-native-localize') {
        subproject.afterEvaluate {
            def mainSourceSet = subproject.android.sourceSets.main
            mainSourceSet.kotlin.srcDirs = new ArrayList(mainSourceSet.java.srcDirs)
        }
    }
}
