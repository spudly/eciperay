ignores:
  - '@eciperay/theme' # Imported via @import in global.css; depcheck does not trace CSS imports
  - '@babel/preset-env' # Babel preset used by React Native toolchain, not imported directly in app source
  - '@babel/runtime' # Babel runtime helpers injected by the compiler, not imported directly in app source
  - '@react-native-community/cli' # React Native CLI entry point; invoked via npm scripts (start, ios, android)
  - '@react-native-community/cli-platform-android' # Android platform module for React Native CLI, loaded by the CLI at build time
  - '@react-native-community/cli-platform-ios' # iOS platform module for React Native CLI, loaded by the CLI at build time
  - '@types/react-test-renderer' # Type definitions for react-test-renderer; no direct imports in app source
  - patch-package # Patches are applied from the root postinstall script, not imported in app source
  - '@tailwindcss/postcss' # Used by postcss.config.mjs, not imported in app source
  - tailwindcss # Imported via @import in global.css; depcheck does not trace CSS imports
  - postcss # Used by postcss.config.mjs, not imported in app source
  - react-native-css # NativeWind v5 peer dependency; loaded by Metro, not imported in app source
  - react-native-safe-area-context # Required peer dependency of @react-navigation; autolinked without direct imports
  - react-native-screens # Required peer dependency of @react-navigation; autolinked without direct imports
  - metro-resolver # Used by metro.config.cjs; hoisted from @react-native/metro-config
  - react-native-worklets # Peer dependency of react-native-reanimated; loaded by the native runtime
  - '@posthog/cli' # Invoked by PostHog Gradle/Xcode source map upload scripts at release build time
  - '@posthog/react-native-plugin' # Native PostHog SDK; autolinked for native crash capture
  - react-native-asset # Invoked by npm run link:fonts to link TTF assets into iOS/Android projects
specials:
  - babel
  - bin
  - jest
