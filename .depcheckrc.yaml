ignores:
  - '@commitlint/cli' # Invoked via Husky commit-msg hook, not imported in source
  - '@commitlint/config-conventional' # Loaded by commitlint.config.cjs, not imported in source
  - '@types/jest' # Type definitions for jest; consumed by workspace jest configs/tests, hoisted to root
  - '@types/nock' # Type definitions for nock; used by server workspace tests, hoisted to root
  - concurrently # Referenced only in root package.json scripts (dev, ci), not imported in source
  - depcheck # Invoked via npm script CLI only, not imported in source
  - github-actionlint # Invoked via npm scripts and lint-staged, not imported in source
  - nock # HTTP mocking library used by server workspace tests, hoisted to root
  - patch-package # Applied via root postinstall script, not imported in source
  - prettier-plugin-jsdoc # Loaded by Prettier via .prettierrc.json plugins field, not imported in source
  - '@swc/core' # Jest transformer (root scripts suite, packages/client, packages/server), configured in jest.config.cjs files
  - '@swc/jest' # Jest transformer (root scripts suite, packages/client, packages/server), configured in jest.config.cjs files
  - istanbul-lib-coverage # Used by packages/server/scripts/mergeCoverage.ts
  - istanbul-lib-report # Used by packages/server/scripts/mergeCoverage.ts
  - istanbul-reports # Used by packages/server/scripts/mergeCoverage.ts
  - tsx # CLI for running TypeScript scripts (validateNodeVersion, findUnusedEslintRules)
  - turbo # Invoked via npm scripts only (test, test:coverage), not imported in source
specials:
  - bin
  - eslint
  - husky
  - jest
  - lint-staged
  - prettier
