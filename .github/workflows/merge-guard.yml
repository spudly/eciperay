name: Merge guard

# This workflow is separate from ci.yml on purpose. The merge-guard
# job must re-run when a PR body is edited — ticking a pre-merge
# checklist box fires the `edited` event — and GitHub re-runs whole
# workflows, never individual jobs. While the job lived in ci.yml,
# every body edit re-ran the entire build suite just to re-check the
# boxes. Here, an edit re-runs only this ~5-second job, and a push
# runs the build exactly once.
on:
  pull_request:
    branches: [master]
    # `edited` is not a default type: it is listed because ticking a
    # checkbox in the PR body fires it, and the merge-guard job below
    # must re-run when the pre-merge checklist changes.
    types: [opened, synchronize, reopened, edited]

# Each box tick fires its own `edited` event and starts a run; without
# a group the runs race in parallel, and a stale run that fetched an
# older body can finish last and leave a failing check on a completed
# checklist. The group is per PR and per head commit: runs for the
# same commit replace each other (only the newest completes), while
# runs for different commits never cancel each other.
concurrency:
  group:
    merge-guard-${{ github.event.pull_request.number }}-${{
    github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  # Enforces the PR template's pre-merge checklist: a PR whose body
  # still has unchecked task-list items fails here, and the check
  # becomes a required status check in the repo's ruleset when this
  # split lands, so such a PR cannot merge. Dependabot PRs are
  # exempt —
  # their bodies quote upstream changelogs that can contain task
  # lists, and the checklist is for PRs authored in this repo.
  # Self-referential items are also exempt: a box whose truth depends
  # on this guard's own CI result (the template's "CI is green" box —
  # merge-guard is part of CI, so the box can never be honestly
  # checked while this job runs) is not required. The required
  # ci-gate check itself carries that signal instead.
  merge-guard:
    name: merge-guard
    if:
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Fetch PR body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh api "repos/${{ github.repository }}/pulls/${{
          github.event.pull_request.number }}" --jq '.body // ""' >
          "$RUNNER_TEMP/pr-body.md"

      - name: Check for unchecked task-list items
        run: |
          cat > "$RUNNER_TEMP/check-tasks.mjs" <<'EOF'
          import {readFileSync} from 'node:fs';

          const body = readFileSync(process.argv[2], 'utf8');

          // HTML comments often quote the PR template itself; their
          // boxes are not real tasks.
          const uncommented = body.replace(/<!--[\s\S]*?-->/g, '');

          // Self-referential checklist items: their truth depends on
          // this job's own result, so requiring them would make the
          // checklist unsatisfiable (the "CI is green" box cannot be
          // honestly checked while merge-guard itself is part of CI).
          // They are reported as exempt rather than open; ci-gate
          // failing or passing is the real signal for them.
          const selfReferential = [/^CI is green\b/];

          const open = [];
          const exempt = [];
          let fence = null;
          for (const line of uncommented.split('\n')) {
            const fenceMatch = line.match(/^\s*(```+|~~~+)/);
            if (fenceMatch) {
              // A fence line opens a code block; a fence of the same
              // character closes it. Quoted checklists inside code
              // blocks are examples, not tasks.
              if (fence === null) fence = fenceMatch[1][0];
              else if (fenceMatch[1][0] === fence) fence = null;
              continue;
            }
            if (fence !== null) continue;
            // A struck-through item counts as waived — the PR
            // template's convention for boxes that do not apply.
            // No `$` anchor: PR bodies with CRLF line endings leave
            // a trailing \r on each line, which `.` cannot match, so
            // an anchored pattern would silently skip those items.
            const item = line.match(/^\s*[-*+]\s+\[\s\]\s+(\S.*)/);
            if (item && !line.includes('~~')) {
              if (selfReferential.some((re) => re.test(item[1]))) {
                exempt.push(line.trim());
              } else {
                open.push(line.trim());
              }
            }
          }

          for (const line of exempt) {
            console.log(`Exempt (self-referential): ${line}`);
          }

          if (open.length > 0) {
            console.error('Unchecked task-list items in the PR body:');
            for (const line of open) console.error(`  ${line}`);
            console.error(
              'Check each item off, or strike it through (~~...~~) ' +
                'with a reason, per the PR template.',
            );
            process.exit(1);
          }
          console.log(
            'All task-list items in the PR body are complete or waived.',
          );
          EOF
          node "$RUNNER_TEMP/check-tasks.mjs" "$RUNNER_TEMP/pr-body.md"
