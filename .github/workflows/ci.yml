name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  setup:
    name: Discover packages
    runs-on: ubuntu-latest
    outputs:
      test-packages: ${{ steps.discover-packages.outputs.test-packages }}
      lint-packages: ${{ steps.discover-packages.outputs.lint-packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/ci-setup
        with:
          skip-install-on-cache-hit: 'true'

      - name: Discover workspace packages
        id: discover-packages
        run: npm run discover:workspace-packages

  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup and install
        uses: ./.github/actions/ci-setup
        with:
          install-command: npm ci
          skip-install-on-cache-hit: 'true'

  validate:
    name: validate
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/ci-setup
        with:
          skip-install-on-cache-hit: 'true'

      - name: Validate Node version
        run: npm run validate:node-version

  typecheck:
    name: typecheck
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/ci-setup
        with:
          skip-install-on-cache-hit: 'true'

      - name: Typecheck
        run: npm run typecheck

  lint:
    name: lint (${{ matrix.package }})
    needs: [install, setup]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.setup.outputs.lint-packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/ci-setup
        with:
          skip-install-on-cache-hit: 'true'

      - name: Restore ESLint cache
        uses: actions/cache@v5
        with:
          path: .eslintcache
          key:
            eslint-${{ runner.os }}-${{ matrix.package }}-${{
            hashFiles('eslint.config.ts', 'package-lock.json',
            'eslint-rules/**') }}-${{ hashFiles(format('{0}/**',
            matrix.package)) }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ matrix.package }}-${{ hashFiles('eslint.config.ts', 'package-lock.json', 'eslint-rules/**') }}-
            eslint-${{ runner.os }}-${{ matrix.package }}-

      - name: Lint
        run:
          npx eslint ${{ matrix.package }} --max-warnings 0 --cache
          --cache-location .eslintcache --cache-strategy content

  lint-rules:
    name: lint-rules
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/ci-setup
        with:
          skip-install-on-cache-hit: 'true'

      - name: Lint unused rules
        run: npm run lint:unused-rules

  depcheck:
    name: depcheck
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/ci-setup
        with:
          skip-install-on-cache-hit: 'true'

      - name: Depcheck
        run: npm run depcheck

  workflows:
    name: workflows
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/ci-setup
        with:
          skip-install-on-cache-hit: 'true'

      - name: Lint GitHub Actions workflows
        run: npm run workflows:lint

  test:
    name: test (${{ matrix.package }})
    needs: [install, setup]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.setup.outputs.test-packages) }}
        exclude:
          - package: packages/server
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/ci-setup
        with:
          skip-install-on-cache-hit: 'true'

      - name: Test with coverage
        run: npm run test:coverage --workspace=${{ matrix.package }}
        env:
          CI: true

  test-server:
    name: test (packages/server, shard ${{ matrix.shard }}/3)
    needs: install
    runs-on: ubuntu-latest-4-cores
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/ci-setup
        with:
          skip-install-on-cache-hit: 'true'

      - name: Test shard with coverage
        run: npm run test:coverage:ci --workspace=packages/server
        env:
          CI: true
          JEST_SHARD_INDEX: ${{ matrix.shard }}
          JEST_SHARD_TOTAL: 3

      - name: Upload shard coverage
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage-shard-${{ matrix.shard }}
          path: packages/server/coverage/shard-${{ matrix.shard }}/
          if-no-files-found: error

  test-server-coverage:
    name: test (packages/server, merge coverage)
    needs: test-server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/ci-setup
        with:
          skip-install-on-cache-hit: 'true'

      - name: Download shard coverage
        uses: actions/download-artifact@v4
        with:
          pattern: server-coverage-shard-*
          path: packages/server/coverage
          merge-multiple: false

      - name: Merge coverage and verify thresholds
        run: npm run test:coverage:merge --workspace=packages/server
