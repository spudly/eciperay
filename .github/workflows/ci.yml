name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    # `edited` is not a default type: it is listed because ticking a
    # checkbox in the PR body fires it, and the merge-guard job below
    # must re-run when the pre-merge checklist changes.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  packages: read

env:
  NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

# Superseded PR runs are cancelled so fix-pushes don't burn minutes on
# already-obsolete work. Master pushes are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Two tiers: pull requests get a fast tier (affected packages only —
# discovery already does that — tests without coverage, server tests
# unsharded, no coverage gate) for quick signal; master pushes run the
# full suite (all packages, coverage, sharded server tests, and the
# coverage thresholds in the merge job). Release only fires on a green
# master run, so the full gate still guards shipping.

jobs:
  setup:
    name: Discover packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      test-packages: ${{ steps.discover-packages.outputs.test-packages }}
      lint-packages: ${{ steps.discover-packages.outputs.lint-packages }}
      run-scripts-tests:
        ${{ steps.discover-packages.outputs.run-scripts-tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/ci-setup
        with:
          skip-install-on-cache-hit: 'true'

      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run:
          git fetch --depth=1 origin
          "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"

      - name: Discover affected packages
        id: discover-packages
        run: npm run discover:affected-packages

  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup and install
        uses: ./.github/actions/ci-setup
        with:
          install-command: npm ci
          skip-install-on-cache-hit: 'true'

  static:
    name: static checks
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/ci-setup
        with:
          skip-install-on-cache-hit: 'true'

      - name: Validate Node version and UI parity registry
        run: npm run validate:node-version && npm run validate:ui-parity

      - name: Depcheck
        run: npm run depcheck

      - name: Lint GitHub Actions workflows
        run: npm run workflows:lint

  typecheck:
    name: typecheck
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/ci-setup
        with:
          skip-install-on-cache-hit: 'true'

      - name: Typecheck
        run: npm run typecheck

  # One job for all affected packages instead of a per-package matrix:
  # each matrix job paid its own checkout/setup (~1 billed minute each,
  # 8 jobs when every package was affected) to run 30-60s of ESLint.
  lint:
    name: lint
    needs: [install, setup]
    if: needs.setup.outputs.lint-packages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/ci-setup
        with:
          skip-install-on-cache-hit: 'true'

      - name: Restore ESLint cache
        uses: actions/cache@v6
        with:
          path: .eslintcache
          key:
            eslint-${{ runner.os }}-${{ hashFiles('eslint.config.ts',
            'package-lock.json', 'eslint-rules/**') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('eslint.config.ts', 'package-lock.json', 'eslint-rules/**') }}-
            eslint-${{ runner.os }}-

      - name: Lint affected packages
        shell: bash
        env:
          LINT_PACKAGES: ${{ needs.setup.outputs.lint-packages }}
        run: |
          set -euo pipefail
          # One job, but a fresh ESLint process per package. A single
          # invocation over the whole monorepo OOMs the Node heap
          # (master run 39032488320: "heap out of memory", exit 134);
          # the matrix this replaced isolated memory per job. Each
          # package also gets its own cache file under .eslintcache/ —
          # sharing one cache file makes sequential per-package runs
          # prune each other's entries.
          # Older cache restores may bring back .eslintcache as a file.
          if [ -f .eslintcache ]; then rm .eslintcache; fi
          mkdir -p .eslintcache
          echo "$LINT_PACKAGES" | jq -r '.[]' | while read -r pkg; do
            echo "Linting: $pkg"
            cache_name=$(echo "$pkg" | tr '/' '-')
            # --no-error-on-unmatched-pattern (from the TS7 PR): while
            # typescript-eslint is uninstalled pending TS7 support,
            # eslint.config.ts ignores all .ts/.tsx files, so an
            # all-TypeScript package matches no lintable files and
            # ESLint would exit 2. Packages with JS/CJS files are still
            # linted normally. Remove the flag when typescript-eslint
            # is restored.
            npx eslint "$pkg" --max-warnings 0 --no-error-on-unmatched-pattern --cache \
              --cache-location ".eslintcache/$cache_name" \
              --cache-strategy content
          done

  test:
    name: test (${{ matrix.package }})
    needs: [install, setup]
    if:
      needs.setup.outputs.test-packages != '[]' &&
      needs.setup.outputs.test-packages != '["packages/server"]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Fail fast: one package's failure cancels the rest instead of
      # billing every package to completion on a run that will fail.
      fail-fast: true
      matrix:
        package: ${{ fromJson(needs.setup.outputs.test-packages) }}
        exclude:
          - package: packages/server
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/ci-setup
        with:
          skip-install-on-cache-hit: 'true'

      # Fast PR tier: no coverage instrumentation on pull requests.
      # The full suite (coverage + thresholds) runs on master pushes.
      - name: Test (PR fast tier, no coverage)
        if: github.event_name == 'pull_request'
        run: npm run test --workspace=${{ matrix.package }}
        env:
          CI: true

      - name: Test with coverage
        if: github.event_name != 'pull_request'
        run: npm run test:coverage --workspace=${{ matrix.package }}
        env:
          CI: true

  test-scripts:
    name: test (scripts)
    needs: [install, setup]
    if: needs.setup.outputs.run-scripts-tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/ci-setup
        with:
          skip-install-on-cache-hit: 'true'

      - name: Test scripts (PR fast tier, no coverage)
        if: github.event_name == 'pull_request'
        run: npm run test:scripts:quick
        env:
          CI: true

      - name: Test scripts with coverage
        if: github.event_name != 'pull_request'
        run: npm run test:scripts
        env:
          CI: true

  # Fast PR tier for the server: one unsharded job, no coverage.
  # The sharded coverage run + merge gate below run on master pushes.
  test-server-fast:
    name: test (packages/server)
    needs: [install, setup]
    if:
      github.event_name == 'pull_request' &&
      contains(needs.setup.outputs.test-packages, 'packages/server')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/ci-setup
        with:
          skip-install-on-cache-hit: 'true'

      - name: Test without coverage
        run: npm run test --workspace=packages/server
        env:
          CI: true

  test-server:
    name: test (packages/server, shard ${{ matrix.shard }}/3)
    needs: [install, setup]
    if:
      github.event_name != 'pull_request' &&
      contains(needs.setup.outputs.test-packages, 'packages/server')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Fail fast: the coverage-merge job needs all 3 shards, so one
      # failed shard dooms the run — don't bill the others to completion.
      fail-fast: true
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/ci-setup
        with:
          skip-install-on-cache-hit: 'true'

      - name: Test shard with coverage
        run: npm run test:coverage:ci --workspace=packages/server
        env:
          CI: true
          JEST_SHARD_INDEX: ${{ matrix.shard }}
          JEST_SHARD_TOTAL: 3

      - name: Upload shard coverage
        uses: actions/upload-artifact@v7
        with:
          name: server-coverage-shard-${{ matrix.shard }}
          path: packages/server/coverage/shard-${{ matrix.shard }}/
          if-no-files-found: error

  test-server-coverage:
    name: test (packages/server, merge coverage)
    needs: test-server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/ci-setup
        with:
          skip-install-on-cache-hit: 'true'

      - name: Download shard coverage
        uses: actions/download-artifact@v8
        with:
          pattern: server-coverage-shard-*
          path: packages/server/coverage
          merge-multiple: false

      - name: Merge coverage and verify thresholds
        run: npm run test:coverage:merge --workspace=packages/server

  # Enforces the PR template's pre-merge checklist: a PR whose body
  # still has unchecked task-list items fails here, and ci-gate needs
  # this job, so such a PR cannot merge. Dependabot PRs are exempt —
  # their bodies quote upstream changelogs that can contain task
  # lists, and the checklist is for PRs authored in this repo.
  # Self-referential items are also exempt: a box whose truth depends
  # on this guard's own CI result (the template's "CI is green" box —
  # merge-guard is part of CI, so the box can never be honestly
  # checked while this job runs) is not required. The required
  # ci-gate check itself carries that signal instead.
  merge-guard:
    name: merge-guard
    if:
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Fetch PR body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh api "repos/${{ github.repository }}/pulls/${{
          github.event.pull_request.number }}" --jq '.body // ""' >
          "$RUNNER_TEMP/pr-body.md"

      - name: Check for unchecked task-list items
        run: |
          cat > "$RUNNER_TEMP/check-tasks.mjs" <<'EOF'
          import {readFileSync} from 'node:fs';

          const body = readFileSync(process.argv[2], 'utf8');

          // HTML comments often quote the PR template itself; their
          // boxes are not real tasks.
          const uncommented = body.replace(/<!--[\s\S]*?-->/g, '');

          // Self-referential checklist items: their truth depends on
          // this job's own result, so requiring them would make the
          // checklist unsatisfiable (the "CI is green" box cannot be
          // honestly checked while merge-guard itself is part of CI).
          // They are reported as exempt rather than open; ci-gate
          // failing or passing is the real signal for them.
          const selfReferential = [/^CI is green\b/];

          const open = [];
          const exempt = [];
          let fence = null;
          for (const line of uncommented.split('\n')) {
            const fenceMatch = line.match(/^\s*(```+|~~~+)/);
            if (fenceMatch) {
              // A fence line opens a code block; a fence of the same
              // character closes it. Quoted checklists inside code
              // blocks are examples, not tasks.
              if (fence === null) fence = fenceMatch[1][0];
              else if (fenceMatch[1][0] === fence) fence = null;
              continue;
            }
            if (fence !== null) continue;
            // A struck-through item counts as waived — the PR
            // template's convention for boxes that do not apply.
            const item = line.match(/^\s*[-*+]\s+\[\s\]\s+(\S.*)$/);
            if (item && !line.includes('~~')) {
              if (selfReferential.some((re) => re.test(item[1]))) {
                exempt.push(line.trim());
              } else {
                open.push(line.trim());
              }
            }
          }

          for (const line of exempt) {
            console.log(`Exempt (self-referential): ${line}`);
          }

          if (open.length > 0) {
            console.error('Unchecked task-list items in the PR body:');
            for (const line of open) console.error(`  ${line}`);
            console.error(
              'Check each item off, or strike it through (~~...~~) ' +
                'with a reason, per the PR template.',
            );
            process.exit(1);
          }
          console.log(
            'All task-list items in the PR body are complete or waived.',
          );
          EOF
          node "$RUNNER_TEMP/check-tasks.mjs" "$RUNNER_TEMP/pr-body.md"

  # Always-reporting gate for branch protection. The per-package test
  # matrix is discovered dynamically, so legs for unaffected packages
  # never report on narrow PRs — and a required check that never
  # reports blocks the merge. This job needs every job in the workflow
  # and reports on every run: it fails only when a needed job failed
  # or was cancelled, and passes when the rest succeeded or were
  # legitimately skipped.
  ci-gate:
    name: ci-gate
    needs:
      - setup
      - install
      - static
      - typecheck
      - lint
      - test
      - test-scripts
      - test-server-fast
      - test-server
      - test-server-coverage
      - merge-guard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS_JSON" | jq -e '[.[] | .result] | any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "::error::A job this gate depends on failed or was cancelled."
            exit 1
          fi
