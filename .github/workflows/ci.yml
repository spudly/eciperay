name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  packages: read

env:
  NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

# Superseded PR runs are cancelled so fix-pushes don't burn minutes on
# already-obsolete work. Master pushes are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  setup:
    name: Discover packages
    runs-on: ubuntu-latest
    outputs:
      test-packages: ${{ steps.discover-packages.outputs.test-packages }}
      lint-packages: ${{ steps.discover-packages.outputs.lint-packages }}
      run-scripts-tests:
        ${{ steps.discover-packages.outputs.run-scripts-tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/ci-setup
        with:
          skip-install-on-cache-hit: 'true'

      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"

      - name: Discover affected packages
        id: discover-packages
        run: npm run discover:affected-packages

  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup and install
        uses: ./.github/actions/ci-setup
        with:
          install-command: npm ci
          skip-install-on-cache-hit: 'true'

  static:
    name: static checks
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/ci-setup
        with:
          skip-install-on-cache-hit: 'true'

      - name: Validate Node version and UI parity registry
        run: npm run validate:node-version && npm run validate:ui-parity

      - name: Lint unused ESLint rules
        run: npm run lint:unused-rules

      - name: Depcheck
        run: npm run depcheck

      - name: Lint GitHub Actions workflows
        run: npm run workflows:lint

  typecheck:
    name: typecheck
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/ci-setup
        with:
          skip-install-on-cache-hit: 'true'

      - name: Typecheck
        run: npm run typecheck

  lint:
    name: lint (${{ matrix.package }})
    needs: [install, setup]
    if: needs.setup.outputs.lint-packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.setup.outputs.lint-packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/ci-setup
        with:
          skip-install-on-cache-hit: 'true'

      - name: Restore ESLint cache
        uses: actions/cache@v5
        with:
          path: .eslintcache
          key:
            eslint-${{ runner.os }}-${{ matrix.package }}-${{
            hashFiles('eslint.config.ts', 'package-lock.json',
            'eslint-rules/**') }}-${{ hashFiles(format('{0}/**',
            matrix.package)) }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ matrix.package }}-${{ hashFiles('eslint.config.ts', 'package-lock.json', 'eslint-rules/**') }}-
            eslint-${{ runner.os }}-${{ matrix.package }}-

      - name: Lint
        run:
          npx eslint ${{ matrix.package }} --max-warnings 0 --cache
          --cache-location .eslintcache --cache-strategy content

  test:
    name: test (${{ matrix.package }})
    needs: [install, setup]
    if:
      needs.setup.outputs.test-packages != '[]' &&
      needs.setup.outputs.test-packages != '["packages/server"]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.setup.outputs.test-packages) }}
        exclude:
          - package: packages/server
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/ci-setup
        with:
          skip-install-on-cache-hit: 'true'

      - name: Test with coverage
        run: npm run test:coverage --workspace=${{ matrix.package }}
        env:
          CI: true

  test-scripts:
    name: test (scripts)
    needs: [install, setup]
    if: needs.setup.outputs.run-scripts-tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/ci-setup
        with:
          skip-install-on-cache-hit: 'true'

      - name: Test scripts with coverage
        run: npm run test:scripts
        env:
          CI: true

  test-server:
    name: test (packages/server, shard ${{ matrix.shard }}/3)
    needs: [install, setup]
    if: contains(needs.setup.outputs.test-packages, 'packages/server')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/ci-setup
        with:
          skip-install-on-cache-hit: 'true'

      - name: Test shard with coverage
        run: npm run test:coverage:ci --workspace=packages/server
        env:
          CI: true
          JEST_SHARD_INDEX: ${{ matrix.shard }}
          JEST_SHARD_TOTAL: 3

      - name: Upload shard coverage
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage-shard-${{ matrix.shard }}
          path: packages/server/coverage/shard-${{ matrix.shard }}/
          if-no-files-found: error

  test-server-coverage:
    name: test (packages/server, merge coverage)
    needs: test-server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/ci-setup
        with:
          skip-install-on-cache-hit: 'true'

      - name: Download shard coverage
        uses: actions/download-artifact@v4
        with:
          pattern: server-coverage-shard-*
          path: packages/server/coverage
          merge-multiple: false

      - name: Merge coverage and verify thresholds
        run: npm run test:coverage:merge --workspace=packages/server
