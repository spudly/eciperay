name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  packages: read

env:
  NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

# Superseded PR runs are cancelled so fix-pushes don't burn minutes on
# already-obsolete work. Master pushes are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Two tiers: pull requests get a fast tier (affected packages only —
# discovery already does that — tests without coverage, server tests
# unsharded, no coverage gate) for quick signal; master pushes run the
# full suite (all packages, coverage, sharded server tests, and the
# coverage thresholds in the merge job). Release only fires on a green
# master run, so the full gate still guards shipping.

jobs:
  setup:
    name: Discover packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      test-packages: ${{ steps.discover-packages.outputs.test-packages }}
      lint-packages: ${{ steps.discover-packages.outputs.lint-packages }}
      run-scripts-tests:
        ${{ steps.discover-packages.outputs.run-scripts-tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/ci-setup
        with:
          skip-install-on-cache-hit: 'true'

      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run:
          git fetch --depth=1 origin
          "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"

      - name: Discover affected packages
        id: discover-packages
        run: npm run discover:affected-packages

  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup and install
        uses: ./.github/actions/ci-setup
        with:
          install-command: npm ci
          skip-install-on-cache-hit: 'true'

  static:
    name: static checks
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/ci-setup
        with:
          skip-install-on-cache-hit: 'true'

      - name: Validate Node version and UI parity registry
        run: npm run validate:node-version && npm run validate:ui-parity

      - name: Lint unused ESLint rules
        run: npm run lint:unused-rules

      - name: Depcheck
        run: npm run depcheck

      - name: Lint GitHub Actions workflows
        run: npm run workflows:lint

  typecheck:
    name: typecheck
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/ci-setup
        with:
          skip-install-on-cache-hit: 'true'

      - name: Typecheck
        run: npm run typecheck

  # One job for all affected packages instead of a per-package matrix:
  # each matrix job paid its own checkout/setup (~1 billed minute each,
  # 8 jobs when every package was affected) to run 30-60s of ESLint.
  lint:
    name: lint
    needs: [install, setup]
    if: needs.setup.outputs.lint-packages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/ci-setup
        with:
          skip-install-on-cache-hit: 'true'

      - name: Restore ESLint cache
        uses: actions/cache@v5
        with:
          path: .eslintcache
          key:
            eslint-${{ runner.os }}-${{ hashFiles('eslint.config.ts',
            'package-lock.json', 'eslint-rules/**') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('eslint.config.ts', 'package-lock.json', 'eslint-rules/**') }}-
            eslint-${{ runner.os }}-

      - name: Lint affected packages
        shell: bash
        env:
          LINT_PACKAGES: ${{ needs.setup.outputs.lint-packages }}
        run: |
          set -euo pipefail
          # One invocation for all affected packages: sequential
          # per-package runs prune each other's entries from the shared
          # cache file, leaving only the last package's results cached.
          packages=$(echo "$LINT_PACKAGES" | jq -r '.[]')
          echo "Linting: $packages"
          # Package paths contain no spaces; word splitting is intended.
          # shellcheck disable=SC2086
          npx eslint $packages --max-warnings 0 --cache \
            --cache-location .eslintcache --cache-strategy content

  test:
    name: test (${{ matrix.package }})
    needs: [install, setup]
    if:
      needs.setup.outputs.test-packages != '[]' &&
      needs.setup.outputs.test-packages != '["packages/server"]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Fail fast: one package's failure cancels the rest instead of
      # billing every package to completion on a run that will fail.
      fail-fast: true
      matrix:
        package: ${{ fromJson(needs.setup.outputs.test-packages) }}
        exclude:
          - package: packages/server
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/ci-setup
        with:
          skip-install-on-cache-hit: 'true'

      # Fast PR tier: no coverage instrumentation on pull requests.
      # The full suite (coverage + thresholds) runs on master pushes.
      - name: Test (PR fast tier, no coverage)
        if: github.event_name == 'pull_request'
        run: npm run test --workspace=${{ matrix.package }}
        env:
          CI: true

      - name: Test with coverage
        if: github.event_name != 'pull_request'
        run: npm run test:coverage --workspace=${{ matrix.package }}
        env:
          CI: true

  test-scripts:
    name: test (scripts)
    needs: [install, setup]
    if: needs.setup.outputs.run-scripts-tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/ci-setup
        with:
          skip-install-on-cache-hit: 'true'

      - name: Test scripts (PR fast tier, no coverage)
        if: github.event_name == 'pull_request'
        run: npm run test:scripts:quick
        env:
          CI: true

      - name: Test scripts with coverage
        if: github.event_name != 'pull_request'
        run: npm run test:scripts
        env:
          CI: true

  # Fast PR tier for the server: one unsharded job, no coverage.
  # The sharded coverage run + merge gate below run on master pushes.
  test-server-fast:
    name: test (packages/server)
    needs: [install, setup]
    if:
      github.event_name == 'pull_request' &&
      contains(needs.setup.outputs.test-packages, 'packages/server')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/ci-setup
        with:
          skip-install-on-cache-hit: 'true'

      - name: Test without coverage
        run: npm run test --workspace=packages/server
        env:
          CI: true

  test-server:
    name: test (packages/server, shard ${{ matrix.shard }}/3)
    needs: [install, setup]
    if:
      github.event_name != 'pull_request' &&
      contains(needs.setup.outputs.test-packages, 'packages/server')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Fail fast: the coverage-merge job needs all 3 shards, so one
      # failed shard dooms the run — don't bill the others to completion.
      fail-fast: true
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/ci-setup
        with:
          skip-install-on-cache-hit: 'true'

      - name: Test shard with coverage
        run: npm run test:coverage:ci --workspace=packages/server
        env:
          CI: true
          JEST_SHARD_INDEX: ${{ matrix.shard }}
          JEST_SHARD_TOTAL: 3

      - name: Upload shard coverage
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage-shard-${{ matrix.shard }}
          path: packages/server/coverage/shard-${{ matrix.shard }}/
          if-no-files-found: error

  test-server-coverage:
    name: test (packages/server, merge coverage)
    needs: test-server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/ci-setup
        with:
          skip-install-on-cache-hit: 'true'

      - name: Download shard coverage
        uses: actions/download-artifact@v4
        with:
          pattern: server-coverage-shard-*
          path: packages/server/coverage
          merge-multiple: false

      - name: Merge coverage and verify thresholds
        run: npm run test:coverage:merge --workspace=packages/server
