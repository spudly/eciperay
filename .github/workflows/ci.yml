name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  setup:
    name: Discover test packages
    runs-on: ubuntu-latest
    outputs:
      test-packages: ${{ steps.test-packages.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Discover packages with tests
        id: test-packages
        run: |
          packages=$(node --input-type=module -e "
            import { readFileSync, existsSync } from 'node:fs';
            import { join } from 'node:path';

            const { workspaces = [] } = JSON.parse(readFileSync('package.json', 'utf8'));
            const withTests = workspaces.filter((ws) => {
              const pkgPath = join(ws, 'package.json');
              if (!existsSync(pkgPath)) {
                return false;
              }
              const { scripts = {} } = JSON.parse(readFileSync(pkgPath, 'utf8'));
              return scripts['test:coverage'] ?? scripts.test;
            });
            process.stdout.write(JSON.stringify(withTests));
          ")
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup and install
        uses: ./.github/actions/ci-setup
        with:
          install-command: npm ci
          skip-install-on-cache-hit: 'true'

  validate:
    name: validate
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/ci-setup
        with:
          skip-install-on-cache-hit: 'true'

      - name: Validate Node version
        run: npm run validate:node-version

  typecheck:
    name: typecheck
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/ci-setup
        with:
          skip-install-on-cache-hit: 'true'

      - name: Typecheck
        run: npm run typecheck

  lint:
    name: lint
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/ci-setup
        with:
          skip-install-on-cache-hit: 'true'

      - name: Lint
        run: npm run lint

  lint-rules:
    name: lint-rules
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/ci-setup
        with:
          skip-install-on-cache-hit: 'true'

      - name: Lint unused rules
        run: npm run lint:unused-rules

  audit:
    name: audit
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/ci-setup
        with:
          skip-install-on-cache-hit: 'true'

      - name: Audit
        run: npm run audit

  depcheck:
    name: depcheck
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/ci-setup
        with:
          skip-install-on-cache-hit: 'true'

      - name: Depcheck
        run: npm run depcheck

  test:
    name: test (${{ matrix.package }})
    needs: [install, setup]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.setup.outputs.test-packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/ci-setup
        with:
          skip-install-on-cache-hit: 'true'

      - name: Test with coverage
        run: npm run test:coverage --workspace=${{ matrix.package }}
        env:
          CI: true
