name: Release

# Pending-release flow (issue #234). Every push to master runs the
# changesets job: with changesets pending, changesets/action maintains
# the Pending Release PR; without them (the Pending Release PR just
# merged), its publish step (scripts/changesetRelease.ts) tags the
# release and the deploy jobs below run off that tag, as they did under
# semantic-release. This workflow's identity must not change: the
# Android versionCode is this workflow's github.run_number.

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  release:
    name: Changesets
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.result.outputs.released }}
      version: ${{ steps.result.outputs.version }}
      tag: ${{ steps.result.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/ci-setup
        with:
          install-command: npm ci
          skip-install-on-cache-hit: 'true'

      - name: Record current release tag
        id: baseline
        run: |
          echo "tag=$(git tag -l 'v*' --sort=-v:refname | head -1)" \
            >> "$GITHUB_OUTPUT"

      - name: Changesets
        id: changesets
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.CHANGESETS_TOKEN || secrets.GITHUB_TOKEN }}
          publish-script: npx tsx scripts/changesetRelease.ts
          commit-message: 'chore(release): pending release'
          pr-title: 'chore(release): pending release'
          create-github-releases: false
          push-git-tags: false
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Determine published tag
        id: result
        if: steps.changesets.outputs.has-changesets == 'false'
        run: |
          VERSION=$(node -p "require('./packages/app/package.json').version")
          TAG="v${VERSION}"
          if [[ "${TAG}" != "${{ steps.baseline.outputs.tag }}" ]] && \
            git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  resolve-deploy:
    name: Resolve deploy targets
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    outputs:
      deploy_fly: ${{ steps.deploy.outputs.deploy_fly }}
      deploy_android: ${{ steps.deploy.outputs.deploy_android }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.tag }}

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/ci-setup
        with:
          install-command: npm ci
          skip-install-on-cache-hit: 'true'

      - name: Resolve deploy targets
        id: deploy
        run: |
          NEW_TAG='${{ needs.release.outputs.tag }}'
          PREV_TAG=$(git tag -l 'v*' --sort=-v:refname | grep -v "^${NEW_TAG}$" | head -1 || true)
          if [[ -z "${PREV_TAG}" ]]; then
            npx tsx scripts/resolveDeployTargetsCli.ts --first-release "${NEW_TAG}"
          else
            npx tsx scripts/resolveDeployTargetsCli.ts "${PREV_TAG}" "${NEW_TAG}"
          fi

  deploy-fly:
    name: Deploy Fly
    needs: [release, resolve-deploy]
    if: needs.resolve-deploy.outputs.deploy_fly == 'true'
    uses: ./.github/workflows/fly-deploy.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
    secrets: inherit

  deploy-android:
    name: Deploy Android
    needs: [release, resolve-deploy]
    if: needs.resolve-deploy.outputs.deploy_android == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/android-deploy.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
      version: ${{ needs.release.outputs.version }}
      tag: ${{ needs.release.outputs.tag }}
      play_track: internal
    secrets: inherit
