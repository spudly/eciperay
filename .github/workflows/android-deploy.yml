name: Android Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: android-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build Android release APK
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/ci-setup
        with:
          install-command: npm ci
          skip-install-on-cache-hit: 'true'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is required for signed release builds."
            exit 1
          fi
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > packages/app/android/app/upload-keystore.jks

      - name: Build release APK
        run:
          bash scripts/android-release.sh -PVERSION_CODE=${{ github.run_number
          }}
        env:
          APP_ENV: production
          API_BASE_URL: https://eciperay.com/api
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          ANDROID_KEYSTORE_PATH: upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify production API URL is baked into bundle
        run: |
          grep -q 'https://eciperay.com/api' packages/app/env-shim.js
          grep -q "${SUPABASE_URL}" packages/app/env-shim.js
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: eciperay-android-${{ github.run_number }}
          path: packages/app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
