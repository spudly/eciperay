name: Android Deploy

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        type: string
        required: true
      version:
        description: App version from semantic-release
        type: string
        required: false
      tag:
        description: Git tag for the release
        type: string
        required: false
      play_track:
        description: Google Play track (build-only skips Play upload)
        type: string
        required: false
        default: internal
  workflow_dispatch:
    inputs:
      play_track:
        description: |
          Google Play destination. build-only skips Play upload (AAB artifact only).
          internal = Internal testing, alpha = Closed testing, beta = Open testing,
          production = Production, internalsharing = quick share link (not a release track).
        type: choice
        required: true
        default: internal
        options:
          - build-only
          - internal
          - alpha
          - beta
          - production
          - internalsharing

# Prettier splits ${{ ... }} across lines, making concurrency.group invalid YAML
# prettier-ignore
concurrency:
  group: android-deploy-${{ inputs.tag || github.event.inputs.play_track || 'manual' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build Android release AAB
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/ci-setup
        with:
          install-command: npm ci
          skip-install-on-cache-hit: 'true'

      - name: Resolve app version
        id: app_version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION}"
          if [[ -z "${VERSION}" ]]; then
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "App version: ${VERSION}"

      - name: Setup Android build environment
        uses: ./.github/actions/android-build-setup

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is required for signed release builds."
            exit 1
          fi
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > packages/app/android/app/upload-keystore.jks

      - name: Build release AAB
        working-directory: packages/app/android
        # versionCode must increase on every Play upload; versionName comes from root package.json.
        run: >-
          ./gradlew bundleRelease --build-cache -PVERSION_CODE=${{
          github.run_number }} -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
        env:
          APP_ENV: production
          API_BASE_URL: https://www.eciperay.com/api
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_PROJECT_ID: ${{ secrets.POSTHOG_CLI_PROJECT_ID }}
          POSTHOG_CLI_HOST: https://us.posthog.com
          ANDROID_KEYSTORE_PATH: upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Prepare release AAB filename
        id: aab
        run: |
          SRC="packages/app/android/app/build/outputs/bundle/release/app-release.aab"
          DEST="eciperay-${{ steps.app_version.outputs.version }}.aab"
          cp "${SRC}" "${DEST}"
          echo "path=${DEST}" >> "$GITHUB_OUTPUT"

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: eciperay-android-${{ github.run_number }}
          path: ${{ steps.aab.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB to GitHub Release
        if: inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: ${{ steps.aab.outputs.path }}

      - name: Validate Google Play credentials
        if: >-
          (inputs.play_track != '' && inputs.play_track != 'build-only') ||
          (github.event_name == 'workflow_dispatch' &&
          github.event.inputs.play_track != 'build-only')
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:
            ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -z "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON}" ]]; then
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret is required for Play uploads."
            exit 1
          fi

      - name: Upload to Google Play
        if: >-
          (inputs.play_track != '' && inputs.play_track != 'build-only') ||
          (github.event_name == 'workflow_dispatch' &&
          github.event.inputs.play_track != 'build-only')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText:
            ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.eciperay
          releaseFiles: ${{ steps.aab.outputs.path }}
          tracks: ${{ inputs.play_track || github.event.inputs.play_track }}
          status: completed
