name: Deploy

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to deploy
        type: string
        required: true
  workflow_dispatch:

concurrency:
  group: fly-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: |
          flyctl deploy --remote-only \
            --build-arg "VITE_API_BASE_URL=${VITE_API_BASE_URL}" \
            --build-arg "VITE_SUPABASE_URL=${VITE_SUPABASE_URL}" \
            --build-arg "VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}" \
            --build-arg "VITE_POSTHOG_KEY=${VITE_POSTHOG_KEY}" \
            --build-arg "VITE_POSTHOG_HOST=${VITE_POSTHOG_HOST}" \
            --build-arg "POSTHOG_API_KEY=${POSTHOG_API_KEY}" \
            --build-arg "POSTHOG_PROJECT_ID=${POSTHOG_PROJECT_ID}" \
            --build-arg "POSTHOG_HOST=${POSTHOG_HOST}" \
            --build-arg "GITHUB_SHA=${GITHUB_SHA}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          VITE_API_BASE_URL: /api
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
          POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          GITHUB_SHA: ${{ inputs.ref || github.sha }}
