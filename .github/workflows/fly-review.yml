name: Fly Review App

# Ephemeral per-PR preview deployments on Fly.io, following Fly's official
# review-apps blueprint (https://fly.io/docs/blueprints/review-apps-guide).
# Each PR gets its own Fly app at https://pr-<number>-spudly-eciperay.fly.dev,
# updated on every push and destroyed when the PR closes.
#
# Setup (one-time, see README "PR review apps"): the FLY_API_TOKEN repository
# secret must be an ORG token (`fly tokens create org`) — the app-scoped
# deploy token used by fly-deploy.yml cannot create new apps.
#
# Dataset: review apps run against the Supabase QA dataset, NOT production
# (issue #234). The Supabase values come from the same five PREVIEW_*
# repository secrets that back the persistent preview environment
# (eciperay-next, fly-preview.yml): PREVIEW_DATABASE_URL,
# PREVIEW_SUPABASE_URL, and PREVIEW_SUPABASE_SECRET_KEY feed the server
# runtime; PREVIEW_VITE_SUPABASE_URL and PREVIEW_VITE_SUPABASE_ANON_KEY feed
# the web build. All PR review apps share that one QA dataset (the schema is
# migrated by the persistent preview's deploys — review apps themselves never
# run migrations, see fly.review.toml), so data created while testing a PR
# must follow the QA conventions (`QA —` name prefixes, cleanup at the end).
# The PREVIEW_* secrets are REQUIRED — the server creates its Supabase client
# at import time and will not start without them (validated below).

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  review_app:
    name: Review app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    # Same-repo PRs only: fork PRs receive no secrets, and preview deploys
    # must never run untrusted code with an org token present.
    if: github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: pr-${{ github.event.number }}
    environment:
      name: pr-${{ github.event.number }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The server cannot start without Supabase credentials (it creates
      # the client at import time), so fail fast with a clear message
      # instead of deploying a preview that can only crash-loop. Close
      # events skip this — cleanup must work even if secrets were removed.
      - name: Validate required preview secrets
        if: github.event.action != 'closed'
        env:
          PREVIEW_DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
          PREVIEW_SUPABASE_URL: ${{ secrets.PREVIEW_SUPABASE_URL }}
          PREVIEW_SUPABASE_SECRET_KEY:
            ${{ secrets.PREVIEW_SUPABASE_SECRET_KEY }}
          PREVIEW_VITE_SUPABASE_URL: ${{ secrets.PREVIEW_VITE_SUPABASE_URL }}
          PREVIEW_VITE_SUPABASE_ANON_KEY:
            ${{ secrets.PREVIEW_VITE_SUPABASE_ANON_KEY }}
        run: |
          missing=0
          for name in PREVIEW_DATABASE_URL PREVIEW_SUPABASE_URL \
            PREVIEW_SUPABASE_SECRET_KEY PREVIEW_VITE_SUPABASE_URL \
            PREVIEW_VITE_SUPABASE_ANON_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name repository secret is not set — the review app cannot run against the QA dataset without it."
              missing=1
            fi
          done
          exit $missing

      - name: Deploy review app
        id: deploy
        uses: superfly/fly-pr-review-apps@1.6.0
        with:
          # Review-specific config: no release_command (PR code must never
          # run migrations) and machines may stop fully when idle.
          config: fly.review.toml
          memory: 512
          build_args: >-
            VITE_API_BASE_URL=/api VITE_SUPABASE_URL=${{
            secrets.PREVIEW_VITE_SUPABASE_URL }} VITE_SUPABASE_ANON_KEY=${{
            secrets.PREVIEW_VITE_SUPABASE_ANON_KEY }} VITE_POSTHOG_KEY=${{
            secrets.VITE_POSTHOG_KEY }} VITE_POSTHOG_HOST=${{
            secrets.VITE_POSTHOG_HOST }} POSTHOG_API_KEY=${{
            secrets.POSTHOG_API_KEY }} POSTHOG_PROJECT_ID=${{
            secrets.POSTHOG_PROJECT_ID }}
            POSTHOG_API_HOST=https://us.posthog.com GITHUB_SHA=${{ github.sha }}
          # The Dockerfile mounts NODE_AUTH_TOKEN as a BuildKit secret for
          # the npm ci that fetches @spudly/ui from GitHub Packages — the
          # same PACKAGES_READ_TOKEN secret the release workflow uses.
          build_secrets: NODE_AUTH_TOKEN=${{ secrets.PACKAGES_READ_TOKEN }}
          secrets: >-
            DATABASE_URL=${{ secrets.PREVIEW_DATABASE_URL }} SUPABASE_URL=${{
            secrets.PREVIEW_SUPABASE_URL }} SUPABASE_SECRET_KEY=${{
            secrets.PREVIEW_SUPABASE_SECRET_KEY }} ANTHROPIC_API_KEY=${{
            secrets.ANTHROPIC_API_KEY }} OPENAI_API_KEY=${{
            secrets.OPENAI_API_KEY }} POSTHOG_KEY=${{ secrets.VITE_POSTHOG_KEY
            }} POSTHOG_HOST=https://a.eciperay.com PADDLE_API_KEY=${{
            secrets.PADDLE_API_KEY }} PADDLE_WEBHOOK_SECRET=${{
            secrets.PADDLE_WEBHOOK_SECRET }} PADDLE_ENVIRONMENT=sandbox

      # The deploy action reports success once machines update, even if
      # the app then crash-loops — so verify the preview actually serves
      # before posting its URL. Machines scale to zero and cold-start
      # slowly, so allow up to ~3 minutes. If this fails, the job fails
      # and no URL is posted.
      - name: Verify preview health
        if: github.event.action != 'closed'
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          for i in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$PREVIEW_URL/api/health" || true)
            echo "Attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::Preview at $PREVIEW_URL did not return 200 from /api/health — not posting its URL."
          exit 1

      # Vercel-style annotation: one sticky comment per PR carrying the
      # preview URL, updated in place on every deploy (no comment spam).
      - name: Comment preview URL on the PR
        if: success() && github.event.action != 'closed'
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- fly-review-app -->';
            const fallback = `https://pr-${context.issue.number}-spudly-eciperay.fly.dev`;
            const url = process.env.PREVIEW_URL || fallback;
            const body = [
              marker,
              '### 🚀 Preview deployment',
              '',
              `**${url}**`,
              '',
              `Deployed from ${context.sha.slice(0, 7)} by the Fly review-app workflow. Updated on every push; destroyed when this PR closes.`,
              '',
              'Runs against the QA dataset, not production — safe for signed-in manual testing with the QA account.',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user.login === 'github-actions[bot]' && c.body.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # The deploy action destroys the app with `|| true`, so its success
      # does not prove deletion. Confirm the app is actually gone (Fly
      # API returns 404) before the PR comment may claim it was
      # destroyed; any other result fails the job and the claim is not
      # posted.
      - name: Verify preview app destroyed
        if: github.event.action == 'closed'
        env:
          APP_NAME: pr-${{ github.event.number }}-spudly-eciperay
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 -H "Authorization: Bearer $FLY_API_TOKEN" "https://api.machines.dev/v1/apps/$APP_NAME" || true)
          echo "Fly API lookup for $APP_NAME: HTTP $code"
          if [ "$code" != "404" ]; then
            echo "::error::Preview app $APP_NAME could not be confirmed destroyed (HTTP $code)."
            exit 1
          fi

      - name: Mark preview destroyed on close
        if: github.event.action == 'closed'
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- fly-review-app -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user.login === 'github-actions[bot]' && c.body.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: `${marker}\n### 🚀 Preview deployment\n\nThis PR's preview app has been destroyed.`,
              });
            }
