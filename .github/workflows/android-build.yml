name: Android Build

# Phase 1 of #183: PR CI must build the Android app. Until now every
# native-side break (the AGP 9 chain of 2026-10-21: Gradle wrapper minimum,
# kotlin-android plugin conflicts, a removed ProGuard API, library-module
# source-set divergence) was discovered only in the post-merge release run,
# behind a green PR CI.
#
# This job runs the same install path as the release build (npm ci, so
# patch-package patches apply) and the same Gradle task (bundleRelease),
# minus the Play upload and the release keystore — app/build.gradle falls
# back to the debug signing config when no keystore env is present, so no
# signing secrets are needed on PRs.
#
# Since 2026-11-02 the build runs ONLY on release PRs (head branch
# changeset-release/*) instead of on every PR that touches app-affecting
# paths: the ~12-minute build was the long pole of the PR review loop,
# and the release PR is where a native build is needed before publish.
# The accepted tradeoff: a native-only break (e.g. a Metro module
# resolution failure) now surfaces on the release PR rather than on the
# PR that caused it.
#
# Phase 2 (emulator use-case tests) is tracked in #183 and is not part of
# this job yet.
#
# Same-repo PRs only: fork PRs receive no secrets, so NODE_AUTH_TOKEN
# would be empty and a cold-cache `npm ci` cannot fetch the private
# @spudly/ui package from GitHub Packages. That package's repository is
# spudly/design-system, not this repo, so this repo's GITHUB_TOKEN cannot
# be relied on to read it either. Fork builds are therefore intentionally
# unsupported here — the same gate fly-review.yml uses — rather than
# failing inside npm ci before Gradle ever runs.

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The release-PR test lives in this job instead of on the workflow
  # trigger. A workflow-level filter means the workflow never runs on
  # ordinary PRs, so the build check never reports — and a required
  # check that never reports blocks merges. Detecting the branch in a
  # job lets the build report "skipped" and the android-gate below
  # report on every PR.
  #
  # The heavy build runs only on release PRs: pull requests whose head
  # branch starts with changeset-release/ (the branch the changesets
  # release automation opens, e.g. changeset-release/master). Every
  # other event — ordinary PRs and manual workflow_dispatch runs —
  # skips the build.
  changes:
    name: Detect release PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run-build: ${{ steps.detect.outputs.run-build }}
    steps:
      - name: Detect release PR
        id: detect
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [[ "$HEAD_REF" == changeset-release/* ]]; then
            echo "run-build=true" >> "$GITHUB_OUTPUT"
            if [ "$HEAD_REPO" != "$THIS_REPO" ]; then
              # The android-build job's own same-repository condition
              # skips the build for fork PRs; the summary must say so
              # instead of claiming a build is running.
              echo "::notice::Android build skipped: fork PRs are not built (no secrets access)."
              {
                echo "### Android build: skipped (fork PR)"
                echo "This is a release PR, but fork PR builds are unsupported (no secrets access), so the AAB build did not run. android-gate still reports for this PR."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              {
                echo "### Android build: running"
                echo "Release PR (head branch \`$HEAD_REF\`), so the AAB build runs."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "run-build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Android build skipped by design: Android builds run only on release PRs (head branch changeset-release/*)."
            {
              echo "### Android build: skipped by design"
              echo "Android builds run only on release PRs (head branch \`changeset-release/*\`), so the AAB build did not run. android-gate still reports for this PR."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  android-build:
    name: Build Android release AAB
    needs: changes
    if:
      needs.changes.outputs.run-build == 'true' && (github.event_name !=
      'pull_request' || github.event.pull_request.head.repo.full_name ==
      github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/ci-setup
        with:
          install-command: npm ci
          skip-install-on-cache-hit: 'true'

      - name: Setup Android build environment
        uses: ./.github/actions/android-build-setup

      - name: Build Android release AAB
        working-directory: packages/app/android
        run: |
          # The init script disables PostHog source-map upload tasks:
          # uploading is a release (publishing) concern, and PR CI should
          # not fail on it. The release workflow does not pass it.
          ./gradlew bundleRelease --build-cache \
            -I "$GITHUB_WORKSPACE/.github/scripts/disable-posthog-upload.init.gradle" \
            -PVERSION_CODE=${{ github.run_number }} \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
        env:
          APP_ENV: production
          API_BASE_URL: https://www.eciperay.com/api
          # Fallbacks keep the build bundling if these optional secrets
          # are ever unset; same-repo PRs normally use the real secrets.
          SUPABASE_URL:
            ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co'
            }}
          SUPABASE_ANON_KEY:
            ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          POSTHOG_CLI_PROJECT_ID: ${{ secrets.POSTHOG_CLI_PROJECT_ID }}
          POSTHOG_CLI_HOST: https://us.posthog.com

      - name: Upload AAB
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: eciperay-app-release-aab
          path: packages/app/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

  # Always-reporting gate for branch protection: reports on every PR,
  # fails only when the changes detection or the build failed or was
  # cancelled, and passes when the build succeeded or was legitimately
  # skipped (not a release PR, or a fork PR).
  android-gate:
    name: android-gate
    needs: [changes, android-build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS_JSON" | jq -e '[.[] | .result] | any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "::error::A job this gate depends on failed or was cancelled."
            exit 1
          fi
