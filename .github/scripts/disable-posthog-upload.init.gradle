// Init script used ONLY by the PR Android build job
// (.github/workflows/android-build.yml), passed via -I.
//
// posthog-react-native's tooling attaches source-map upload tasks to the
// release bundle task. Uploading is a publishing concern: the release build
// must keep doing it, but a PR build only needs to prove the app compiles
// and bundles — and the upload requires a valid PostHog personal API key
// (phx_), which PR CI must not depend on or be exposed to. Disable the
// upload tasks for CI builds only; the release workflow does not pass
// this script.
//
// The tasks are disabled from the task-graph whenReady hook: they are
// created late (after project evaluation) by the PostHog/RN tooling, and
// a tasks.matching/configureEach registration proved unreliable — the
// upload task still executed. whenReady runs after the graph is fully
// populated, so every upload task is caught. Matching is on any task
// whose name mentions both PostHog and upload: the bundle source-map
// tasks (createBundle..._PostHogUpload_...) and the ProGuard mapping
// task (uploadPostHogProguardMappingsRelease) are named differently.
gradle.taskGraph.whenReady { graph ->
    graph.allTasks
        .findAll {
            def n = it.name.toLowerCase()
            n.contains('posthog') && n.contains('upload')
        }
        .each { it.enabled = false }
}
