name: Android build setup
description:
  Setup Java, Android SDK, and restore Gradle/native caches for release builds

runs:
  using: composite
  steps:
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
        cache: gradle

    - name: Restore Android SDK cache
      uses: actions/cache@v5
      with:
        path: |
          /usr/local/lib/android/sdk/ndk
          /usr/local/lib/android/sdk/cmake
          /usr/local/lib/android/sdk/build-tools
          /usr/local/lib/android/sdk/platforms
        key:
          android-sdk-${{ hashFiles('packages/app/android/build.gradle',
          'packages/app/android/gradle.properties') }}

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android SDK packages
      shell: bash
      run: |
        sdkmanager --install \
          "platform-tools" \
          "platforms;android-36" \
          "build-tools;36.0.0" \
          "ndk;27.1.12297006" \
          "cmake;3.22.1"

    - name: Restore Gradle caches
      uses: actions/cache@v5
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          packages/app/android/.gradle
        key:
          gradle-${{ runner.os }}-${{ hashFiles('package-lock.json',
          'packages/app/android/**/*.gradle*',
          'packages/app/android/gradle.properties') }}
        restore-keys: |
          gradle-${{ runner.os }}-

    - name: Restore native build cache
      uses: actions/cache@v5
      with:
        path: |
          node_modules/react-native-reanimated/android/.cxx
          node_modules/react-native-worklets/android/.cxx
          node_modules/react-native-gesture-handler/android/.cxx
          node_modules/react-native-screens/android/.cxx
          packages/app/android/app/.cxx
        key:
          native-${{ runner.os }}-${{ hashFiles('package-lock.json',
          'packages/app/android/**/*.gradle*',
          'packages/app/android/gradle.properties') }}
        restore-keys: |
          native-${{ runner.os }}-
