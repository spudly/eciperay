name: Android build setup
description:
  Setup Java, Android SDK, and restore Gradle caches for release builds

runs:
  using: composite
  steps:
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
        cache: gradle

    - name: Restore Android SDK cache
      uses: actions/cache@v5
      with:
        path: |
          /usr/local/lib/android/sdk/ndk
          /usr/local/lib/android/sdk/cmake
          /usr/local/lib/android/sdk/build-tools
          /usr/local/lib/android/sdk/platforms
        key:
          android-sdk-${{ hashFiles('packages/app/android/build.gradle',
          'packages/app/android/gradle.properties') }}

    # NOTE: android-actions/setup-android@v3 was removed. It runs
    # `sdkmanager tools`, but Google deleted the legacy `tools` package, so
    # the action always fails now. The ubuntu-latest runner already ships the
    # Android SDK (ANDROID_HOME) with cmdline-tools on PATH.

    - name: Accept Android SDK licenses
      shell: bash
      run: yes | sdkmanager --licenses > /dev/null || true

    - name: Install Android SDK packages
      shell: bash
      run: |
        sdkmanager --install \
          "platform-tools" \
          "platforms;android-36" \
          "build-tools;36.0.0" \
          "ndk;27.1.12297006" \
          "cmake;3.22.1"

    - name: Restore Gradle caches
      uses: actions/cache@v5
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          packages/app/android/.gradle
        key:
          gradle-${{ runner.os }}-${{ hashFiles('package-lock.json',
          'packages/app/android/**/*.gradle*',
          'packages/app/android/gradle.properties') }}
        restore-keys: |
          gradle-${{ runner.os }}-
