# Fly.io app config — https://fly.io/docs/reference/configuration/
#
# First-time setup:
#   fly auth login
#   fly apps create eciperay   # or change `app` below
#   fly secrets set ...        # see README "Deploy to Fly.io"
#   ./scripts/fly-deploy.sh

app = 'eciperay'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

  [build.args]
    VITE_API_BASE_URL = '/api'

[env]
  NODE_ENV = 'production'
  HOST = '0.0.0.0'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '15s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[deploy]
  release_command = 'npm run migrate --workspace=packages/server'
